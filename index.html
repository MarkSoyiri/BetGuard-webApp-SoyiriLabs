<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BetGuard — your responsible betting companion. Track spending, set budgets, and build healthier betting habits." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>BetGuard — Take Control of Your Betting Habits</title>
  </head>
  <body>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('betguard:theme'));
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
