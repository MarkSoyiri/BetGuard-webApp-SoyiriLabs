<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="BetGuard — your responsible betting companion. Track spending, set budgets, and build healthier betting habits." />
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>BetGuard — Take Control of Your Betting Habits</title>

  <body>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('betguard:theme'));
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
